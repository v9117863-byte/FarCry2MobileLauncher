name: Far Cry 2 mobile launcher build

on:
  push:
    branches: [ integration/winlator-engine ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-and-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Far Cry 2 launcher
        uses: actions/checkout@v4
      - name: Checkout pinned Winlator
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: f8a211ce7fd776de9a2642b45d166016876eaa86
          path: .ci/winlator-upstream
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install pinned NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;24.0.8215888" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
      - name: Install runtime staging utilities
        run: sudo apt-get update && sudo apt-get install -y zstd patchelf
      - name: Stage Winlator Java, native, JNI, resources and offline assets
        run: bash scripts/stage-winlator-into-app.sh .ci/winlator-upstream
      - name: Build merged Android APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: FarCry2Mobile-Winlator-merged-experiment
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
