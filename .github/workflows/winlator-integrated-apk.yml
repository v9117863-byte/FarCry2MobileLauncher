name: Far Cry 2 mobile launcher build

on:
  push:
    branches: [ integration/winlator-engine ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-and-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Far Cry 2 launcher
        uses: actions/checkout@v4
      - name: Checkout pinned Winlator
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: f8a211ce7fd776de9a2642b45d166016876eaa86
          path: .ci/winlator-upstream
          persist-credentials: false
      - name: Checkout pinned Vortek guest ICD source
        uses: actions/checkout@v4
        with:
          repository: brunodev85/vortek
          ref: 4e0d790ef8afee4766b40e194bc82d2505d5ea0f
          path: .ci/vortek-upstream
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install pinned NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;24.0.8215888" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
      - name: Install runtime staging utilities
        run: sudo apt-get update && sudo apt-get install -y zstd patchelf gcc-aarch64-linux-gnu gcc-mingw-w64-i686 libvulkan-dev libx11-dev
      - name: Stage Winlator Java, native, JNI, resources and offline assets
        run: bash scripts/stage-winlator-into-app.sh .ci/winlator-upstream .ci/vortek-upstream
      - name: Build merged Android APK
        shell: bash
        run: |
          # Retry transient Maven/Gradle repository failures instead of losing the APK build.
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt/3"
            if gradle --no-daemon :app:assembleDebug --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; retrying after 20 seconds..."
              sleep 20
            fi
          done
          exit 1
      - name: Verify Box64 is packaged as executable ARM64 JNI library
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libbox64.so'
          unzip -p "$APK" lib/arm64-v8a/libbox64.so > /tmp/libbox64.so
          file /tmp/libbox64.so
          readelf -h /tmp/libbox64.so | grep -E 'Class:|Machine:'
          readelf -l /tmp/libbox64.so | grep 'Requesting program interpreter'
      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: FarCry2Mobile-Winlator-merged-experiment
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
