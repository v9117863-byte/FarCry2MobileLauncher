name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify map and manual are packaged
        run: |
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/index.html > /tmp/fc2-index.html
          grep -q 'WORLD MAP' /tmp/fc2-index.html
          grep -q 'FIELD MANUAL' /tmp/fc2-index.html
          grep -q 'chooseWorldMap' /tmp/fc2-index.html

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarCry2MobileLauncher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
