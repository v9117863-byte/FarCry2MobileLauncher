name: Winlator upstream build check

on:
  workflow_dispatch:
  push:
    branches:
      - integration/winlator-engine
    paths:
      - ".github/workflows/winlator-upstream-build.yml"
      - "WINLATOR_UPSTREAM_PIN.md"

permissions:
  contents: read

jobs:
  build-upstream:
    name: Build pinned Winlator engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout launcher integration branch
        uses: actions/checkout@v4

      - name: Checkout pinned Winlator source
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: f8a211ce7fd776de9a2642b45d166016876eaa86
          path: winlator-upstream

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned native toolchains
        run: sdkmanager "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Build upstream debug APK
        working-directory: winlator-upstream
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload upstream build artifact
        uses: actions/upload-artifact@v4
        with:
          name: winlator-upstream-debug-${{ github.sha }}
          path: winlator-upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
